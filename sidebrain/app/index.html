<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sidebrain</title>
  <meta name="description" content="What’s due today, flashcards, lecture notes and practice from Sidebrain, plus quick notes and to-dos from the phone.">
  <!-- Defence in depth for untrusted message text and AI output; the hash is the theme script's below (web/nexi.test.mjs checks it). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-MsVmYvvchYYuYJxp/HE1b9z9+wdvD/gd/trzQXpJfME=' https://accounts.google.com/gsi/client; connect-src 'self' https://rdwavprncthvujmckige.supabase.co wss://rdwavprncthvujmckige.supabase.co https://accounts.google.com/gsi/ https://world.openfoodfacts.org; img-src 'self' data: blob: https://rdwavprncthvujmckige.supabase.co; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; media-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <script>/* Account → Appearance, applied before the first paint (app.js applyTheme does the same on a change) */
    try { var t = localStorage.getItem("sidebrain.theme"); if (t === "light" || t === "dark") { document.documentElement.dataset.theme = t;
      for (var m of document.querySelectorAll("meta[name=theme-color]")) m.content = t === "dark" ? "#000000" : "#f2f2f7"; } } catch (e) {}</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sidebrain">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="bar" id="bar">
    <button class="circle" id="back" type="button" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
    </button>
    <p class="bar-title" id="bar-title" aria-hidden="true"></p>
    <button class="circle" id="ask" type="button" aria-label="Ask Nexi" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.25c4.56 0 8.25 3.13 8.25 7s-3.69 7-8.25 7c-1.1 0-2.15-.18-3.1-.52L4.75 19.5l1.2-3.6c-1.4-1.3-2.2-2.9-2.2-4.65 0-3.87 3.69-7 8.25-7z"/></svg>
    </button>
    <button class="pill" id="read-all" type="button" hidden>Mark all read</button>
    <button class="circle avatar" id="account" type="button" aria-label="Account" hidden></button>
    <button class="circle" id="contents" type="button" aria-label="Contents" aria-expanded="false" aria-controls="contents-menu" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6.5h10M9.5 12h10M9.5 17.5h10"/><circle cx="5" cy="6.5" r=".9"/><circle cx="5" cy="12" r=".9"/><circle cx="5" cy="17.5" r=".9"/></svg>
    </button>
    <button class="circle" id="more" type="button" aria-label="More" aria-expanded="false" aria-controls="contents-menu" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.1"/><circle cx="12" cy="12" r="1.1"/><circle cx="18" cy="12" r="1.1"/></svg>
    </button>
    <p class="bar-sec" id="bar-sec" aria-hidden="true"></p>
  </header>
  <ul class="menu" id="contents-menu" hidden></ul>

  <main id="main">
    <section id="signin" class="page" hidden>
      <img class="app-icon" src="icon.svg" width="64" height="64" alt="">
      <h1 class="title1">Sidebrain</h1>
      <p class="sub">Use the same Google account as the Mac.</p>
      <div id="gsi"></div>
      <p class="foot" id="signin-status" role="status"></p>
      <button class="btn plain" id="redirect-signin" type="button" hidden>Sign in another way</button>
    </section>

    <section id="today" class="page" hidden></section>

    <section id="study" class="page" hidden></section>

    <section id="inbox" class="page" hidden></section>

    <section id="train" class="page" hidden></section>
  </main>

  <div class="scrim" id="scrim" hidden></div>
  <section class="day peek" id="day" aria-label="The rest of today" hidden>
    <div class="day-head" id="day-head">
      <div class="grabber" aria-hidden="true"></div>
      <button class="day-sum" id="day-sum" type="button" aria-expanded="false"><span id="day-sum-text"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
    </div>
    <div class="day-scroll" id="day-scroll"></div>
  </section>

  <nav class="dock" id="dock" hidden>
    <div class="tabs chrome" id="tabs">
      <span class="lens" aria-hidden="true"></span>
      <button type="button" data-tab="today" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.75"/><path d="M12 2.75v2M12 19.25v2M2.75 12h2M19.25 12h2M5.46 5.46l1.41 1.41M17.13 17.13l1.41 1.41M5.46 18.54l1.41-1.41M17.13 6.87l1.41-1.41"/></svg>
        <span>Today</span>
      </button>
      <button type="button" data-tab="study">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10.2 5.2 7.7 4.6 3.75 4.6v13c3.95 0 6.45.6 8.25 1.9 1.8-1.3 4.3-1.9 8.25-1.9v-13c-3.95 0-6.45.6-8.25 1.9zM12 6.5v13"/></svg>
        <span>Study</span>
      </button>
      <button type="button" data-tab="inbox">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.75 13.25l2.6-7.1a1.5 1.5 0 0 1 1.4-.9h8.5a1.5 1.5 0 0 1 1.4.9l2.6 7.1v4.5a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5zM3.75 13.25H8.5l1 2h5l1-2h4.75"/></svg>
        <span>Inbox</span><b class="badge" id="inbox-badge" aria-hidden="true" hidden></b>
      </button>
      <button type="button" data-tab="train" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.25 9.5v5M6.25 7v10M17.75 7v10M20.75 9.5v5M6.25 12h11.5"/></svg>
        <span>Train</span>
      </button>
    </div>
    <button class="add chrome" id="add" type="button" aria-label="Add">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </nav>

  <div class="review" id="review" role="dialog" aria-modal="true" aria-label="Review" hidden></div>
  <div class="toast chrome" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" id="toast-undo">Undo</button></div>

  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 class="section-title" id="sheet-title">Account</h2>
      <button class="close" type="button" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 7.5l9 9M16.5 7.5l-9 9"/></svg>
      </button>
    </div>
    <div id="sheet-body"></div>
  </dialog>

  <dialog class="sheet" id="add-sheet" aria-label="Add">
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <div class="seg" role="tablist" aria-label="What to add" style="--n: 3">
        <span class="thumb" aria-hidden="true"></span>
        <button type="button" role="tab" data-mode="todo" aria-selected="true">To-do</button>
        <button type="button" role="tab" data-mode="note" aria-selected="false">Note</button>
        <button type="button" role="tab" data-mode="ask" aria-selected="false">Ask</button>
      </div>
      <button class="close" type="button" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 7.5l9 9M16.5 7.5l-9 9"/></svg>
      </button>
    </div>
    <form id="todo-form" class="pane" autocomplete="off" novalidate>
      <ul class="group flat">
        <li class="field">
          <div class="mirror" id="todo-mirror" aria-hidden="true"></div>
          <input id="todo" type="text" placeholder="To-do" aria-label="To-do" enterkeyhint="done" autocapitalize="sentences">
        </li>
        <li>
          <label class="row" id="todo-date-row">
            <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.75" y="5.25" width="16.5" height="15" rx="2.75"/><path d="M3.75 9.75h16.5M8 3.25v3.5M16 3.25v3.5"/></svg>
            <span class="text"><span class="title">Date</span></span>
            <span class="trail" id="todo-date-label">None</span>
            <input type="date" class="overlay" id="todo-date" aria-label="Date">
          </label>
        </li>
      </ul>
      <button class="btn primary" type="submit" id="todo-save" disabled>Save</button>
      <p class="foot" id="todo-status" role="status"></p>
    </form>
    <form class="compose pane" data-compose="add" autocomplete="off" hidden></form>
  </dialog>

  <dialog class="sheet tall" id="item-sheet" aria-labelledby="item-title">
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <div class="head-text">
        <h2 class="headline" id="item-title"></h2>
        <p class="foot" id="item-meta"></p>
      </div>
      <button class="close" type="button" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 7.5l9 9M16.5 7.5l-9 9"/></svg>
      </button>
    </div>
    <div class="pane" id="item-body"></div>
    <div class="sheet-foot" id="item-foot"></div>
  </dialog>

  <dialog class="sheet nexi" id="nexi-sheet" aria-labelledby="nexi-title">
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <div class="head-text">
        <h2 class="headline" id="nexi-title">Nexi</h2>
        <p class="foot" id="nexi-about"></p>
      </div>
      <button class="close" type="button" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 7.5l9 9M16.5 7.5l-9 9"/></svg>
      </button>
    </div>
    <div class="nexi-log" id="nexi-log"></div>
    <p class="sr-only" id="nexi-live" aria-live="polite"></p>
    <div class="nexi-chips" id="nexi-chips"></div>
    <form class="nexi-form" id="nexi-form" autocomplete="off">
      <input id="nexi-q" type="text" maxlength="2000" placeholder="Ask Nexi" aria-label="Ask Nexi" enterkeyhint="send" autocapitalize="sentences">
      <button class="send" id="nexi-send" type="submit" aria-label="Send" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18.5v-13M6.5 11L12 5.5l5.5 5.5"/></svg></button>
    </form>
  </dialog>

  <dialog class="sheet action" id="confirm-sheet" aria-labelledby="confirm-msg">
    <ul class="group"><li><p class="msg" id="confirm-msg"></p></li><li><button class="row destructive" type="button" id="confirm-yes"></button></li></ul>
    <ul class="group"><li><button class="row" type="button" data-close>Cancel</button></li></ul>
  </dialog>

  <dialog class="sheet action" id="sug-sheet" aria-labelledby="sug-msg">
    <ul class="group"><li><p class="msg" id="sug-msg"></p></li>
      <li><button class="row" type="button" data-act="sug-mute" data-mute="snooze">Snooze 3 days</button></li>
      <li><button class="row" type="button" data-act="sug-mute" data-mute="dismiss">Dismiss</button></li></ul>
    <ul class="group"><li><button class="row" type="button" data-close>Cancel</button></li></ul>
  </dialog>

  <dialog class="sheet" id="task-sheet" aria-labelledby="task-title">
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <div class="head-text">
        <h2 class="headline" id="task-title"></h2>
        <p class="foot" id="task-detail"></p>
      </div>
      <button class="close" type="button" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 7.5l9 9M16.5 7.5l-9 9"/></svg>
      </button>
    </div>
    <ul class="group" id="task-moves"></ul>
    <ul class="group">
      <li><button class="row destructive" type="button" data-letgo>
        <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.25"/><path d="M9.25 9.25l5.5 5.5M14.75 9.25l-5.5 5.5"/></svg>
        <span class="text"><span class="title">Let go</span></span>
      </button></li>
    </ul>
  </dialog>
</body>
</html>
